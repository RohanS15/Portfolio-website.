<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f8" />
    <meta
      name="description"
      content="Explore Rohan’s work across cybersecurity, software, and automation, alongside browser based experiments and synthetic security simulations."
    />
    <meta
      property="og:title"
      content="Rohan — Digital systems, thoughtfully engineered"
    />
    <meta
      property="og:description"
      content="Cybersecurity, software, and automation in one interactive portfolio."
    />
    <meta property="og:type" content="website" />
    <title>Rohan — Digital systems, thoughtfully engineered</title>
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("portfolio-theme");
        } catch {}
        if (theme !== "light" && theme !== "dark") {
          theme = "dark";
        }
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#121318" : "#f5f6f8");
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
